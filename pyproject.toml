[project]
name = "vol-forecast"
version = "0.1.0"
description = "QUARCC volatility and risk forecasting research project"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "yfinance",
    "matplotlib",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vol_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
